  {id:14,titulo:"Circuito Ciência na Escola: Feira de CT&I com escolas urbanas, rurais e indígenas do Alto Solimões",descricao:"Feira de CT&I com escolas do Alto Solimões.",editalId:"FAPEAM-002",status:"Submetido",entidade:"INC/UFAM",equipe:"Leonor Farias Abreu (proponente) · Murana Arenilhas Oliveira (autora)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:15,titulo:"CT&I Itinerante: Oficinas nas Escolas Municipais de Benjamin Constant",descricao:"Oficinas itinerantes de CT&I.",editalId:"FAPEAM-002",status:"Submetido",entidade:"SEMCTI",equipe:"Alícia Michely Silva do Nascimento (proponente) · Andreza Hilário (autora)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:16,titulo:"Mostra de CT&I (Produções Locais): Socialização de produções científicas locais e impactos comunitários",descricao:"Socialização de produções científicas locais.",editalId:"FAPEAM-002",status:"Submetido",entidade:"INC/UFAM",equipe:"Jose Edinaldo Zane (proponente) · Wiily Alejandro (autor)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:17,titulo:"Podcast da Inovação: CT&I na medida certa — série sobre ciência amazônica",descricao:"Série de podcast sobre ciência amazônica.",editalId:"FAPEAM-002",status:"Submetido",entidade:"InPACTAS",equipe:"Juvan Reis Nogueira (proponente) · Mateus Reinaldo Garcia (autor)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:18,titulo:"1ª Feira de CT&I da Tríplice Fronteira: Evento de CT&I com alcance Brasil-Colômbia-Peru",descricao:"Feira de CT&I internacional.",editalId:"FAPEAM-002",status:"Submetido",entidade:"SEMCTI",equipe:"Raimundo Valdan Pereira Lopes (proponente) · Alícia Nascimento (autora)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:19,titulo:"Narrativas do Território: Exposição Interativa de Ciência, Cultura e Bioeconomia no Alto Solimões",descricao:"Exposição interativa de ciência e bioeconomia.",editalId:"FAPEAM-002",status:"Submetido",entidade:"InPACTAS",equipe:"Pedro Henrique Mariosa (proponente) · Runa Salatta (autora)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:20,titulo:"Narrativas do Território: Produção Audiovisual com Celular para Popularização da Ciência no Alto Solimões",descricao:"Produção audiovisual para popularização da ciência.",editalId:"FAPEAM-002",status:"Submetido",entidade:"InPACTAS",equipe:"Bruna Salatta / Runa Salatta (proponente e autora)",dataSubmissao:"2026-05-15",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:21,titulo:"Sistema inteligente de manejo sustentável do Tambaqui (Colossoma macropomum sp.) em açude no Alto Solimões com monitoramento digital e tecnologias de baixo custo",descricao:"Manejo sustentável do Tambaqui com monitoramento digital.",editalId:"FAPEAM-004",status:"Submetido",entidade:"InPACTAS",equipe:"Pedro Henrique Mariosa (proponente) · Cleyton Cid da Silva Ferreira (autor)",dataSubmissao:"2026-05-05",dataResultado:"",dataExecucao:"",valor:0,obs:""},
  {id:22,titulo:"Science-Trip Amazônia: Plataforma Digital de Ecoturismo Científico com Tecnologias Imersivas e Ciência Cidadã para o Desenvolvimento Sustentável de Comunidades Ribeirinhas e Indígenas do Alto Solimões",descricao:"Plataforma de ecoturismo científico com tecnologias imersivas.",editalId:"FAPEAM-007",status:"Submetido",entidade:"InPACTAS",equipe:"Pedro Henrique Mariosa (proponente) · Cleyton Cid da Silva Ferreira (autor)",dataSubmissao:"2026-05-10",dataResultado:"",dataExecucao:"",valor:150000,obs:"Startup Science-Trip — Tríplice Fronteira."},
];

const fmtBRL=v=>v?("R$ "+Number(v).toLocaleString("pt-BR")):"—";
const fmtData=d=>d?new Date(d+"T00:00:00").toLocaleDateString("pt-BR"):"—";
const EMPTY={titulo:"",descricao:"",editalId:"FAPEAM-002",status:"Rascunho",entidade:"InPACTAS",equipe:"",dataSubmissao:"",dataResultado:"",dataExecucao:"",valor:"",obs:""};
const LS_PROJ="inpactas_proj_v1", LS_EDS="inpactas_eds_v1";

function StatusBadge({s}){
  const c=STATUS_COR[s]||["#eee","#333"];
  return <span style={{background:c[0],color:c[1],fontSize:"0.68rem",fontWeight:700,padding:"0.2rem 0.55rem",borderRadius:"2rem",letterSpacing:"0.03em",whiteSpace:"nowrap"}}>{s}</span>;
}
function EditalBadge({id,eds}){
  const e=eds.find(x=>x.id===id);
  if(!e)return null;
  return <span style={{background:e.cor,color:e.corT,fontSize:"0.65rem",fontWeight:700,padding:"0.15rem 0.55rem",borderRadius:"2rem",letterSpacing:"0.05em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{e.nome} {e.codigo}/2026</span>;
}
function Overlay({open,onClose,children}){
  if(!open)return null;
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(26,35,22,0.6)",zIndex:9999,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"60px 16px 16px",overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:WHITE,borderRadius:14,width:"100%",maxWidth:560,maxHeight:"82vh",overflowY:"auto",boxShadow:"0 24px 80px rgba(26,35,22,0.3)"}}>
        {children}
      </div>
    </div>
  );
}
function Field({label,children}){
  return(
    <div style={{marginBottom:10}}>
      <label style={{fontSize:12,color:INKL,display:"block",marginBottom:3}}>{label}</label>
      {children}
    </div>
  );
}

function App(){
  const [proj,setProj]=useState(PROJETOS);
  const [eds,setEds]=useState(EDITAIS_BASE);
  const [aba,setAba]=useState("projetos");
  const [isAdmin,setIsAdmin]=useState(false);
  const [pin,setPin]=useState("");
  const [pinErr,setPinErr]=useState(false);
  const [showLogin,setShowLogin]=useState(false);
  const [showEdModal,setShowEdModal]=useState(false);
  const [fStatus,setFStatus]=useState("Todos");
  const [fEdital,setFEdital]=useState("");
  const [fEnt,setFEnt]=useState("");
  const [busca,setBusca]=useState("");
  const [detalhe,setDetalhe]=useState(null);
  const [formOpen,setFormOpen]=useState(false);
  const [delId,setDelId]=useState(null);
  const [form,setForm]=useState(EMPTY);
  const [editId,setEditId]=useState(null);
  const [novoEd,setNovoEd]=useState({codigo:"",financiador:"FAPEAM",nome:"",desc:""});
  const [exportTxt,setExportTxt]=useState("");
  const [copied,setCopied]=useState(false);
  const c1=useRef(null),c2=useRef(null),ci1=useRef(null),ci2=useRef(null);

  useEffect(()=>{
    try{
      const rp=localStorage.getItem(LS_PROJ);
      const re=localStorage.getItem(LS_EDS);
      if(rp)setProj(JSON.parse(rp));
      if(re)setEds(JSON.parse(re));
    }catch(e){}
  },[]);

  const saveP=l=>{try{localStorage.setItem(LS_PROJ,JSON.stringify(l));}catch(e){}};
  const saveE=l=>{try{localStorage.setItem(LS_EDS,JSON.stringify(l));}catch(e){}};

  useEffect(()=>{
    if(aba!=="dashboard")return;
    if(!c1.current||!c2.current)return;
    if(ci1.current)ci1.current.destroy();
    if(ci2.current)ci2.current.destroy();
    const gp=["#1A3D2B","#2D7A4F","#4CAF80","#81C99A","#B2DBBF","#D6EDE0"];
    ci1.current=new Chart(c1.current,{
      type:"doughnut",
      data:{labels:eds.map(e=>e.nome+" "+e.codigo),datasets:[{data:eds.map(e=>proj.filter(p=>p.editalId===e.id).length),backgroundColor:gp.slice(0,eds.length),borderWidth:2,borderColor:WHITE}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{size:10},boxWidth:12,padding:8}}}}
    });
    ci2.current=new Chart(c2.current,{
      type:"bar",
      data:{labels:STATUS_LIST,datasets:[{data:STATUS_LIST.map(s=>proj.filter(p=>p.status===s).length),backgroundColor:["#E4E0D8","#BFDBFE","#FDE68A","#A7F3D0","#FECACA","#6EE7B7"],borderRadius:4,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},autoSkip:false,maxRotation:30},grid:{display:false}},y:{beginAtZero:true,ticks:{stepSize:1},grid:{color:"rgba(0,0,0,.05)"}}}}
    });
  },[aba,proj,eds]);

  const login=()=>{
    if(pin===ADMIN_PIN){setIsAdmin(true);setShowLogin(false);setPinErr(false);setPin("");}
    else setPinErr(true);
  };

  const filtrados=proj.filter(p=>
    (!busca||p.titulo.toLowerCase().includes(busca.toLowerCase()))&&
    (!fEdital||p.editalId===fEdital)&&
    (!fEnt||p.entidade===fEnt)&&
    (fStatus==="Todos"||p.status===fStatus)
  );

  const salvar=()=>{
    if(!form.titulo.trim())return;
    const l=editId
      ?proj.map(p=>p.id===editId?Object.assign({},form,{id:editId,valor:Number(form.valor)||0}):p)
      :proj.concat([Object.assign({},form,{id:Date.now(),valor:Number(form.valor)||0})]);
    setProj(l);saveP(l);
    setFormOpen(false);setEditId(null);setForm(EMPTY);
  };

  const excluir=id=>{
    const l=proj.filter(p=>p.id!==id);
    setProj(l);saveP(l);
    setDelId(null);setDetalhe(null);
  };

  const addEd=()=>{
    if(!novoEd.codigo||!novoEd.nome)return;
    const cores=["#FFF0F5","#E8F5E9","#E3F2FD","#FFF8E1","#F3E5F5","#E0F7FA"];
    const txts=["#C2185B","#2E7D32","#1565C0","#E65100","#6A1B9A","#00695C"];
    const i=eds.length%6;
    const l=eds.concat([Object.assign({id:novoEd.financiador+"-"+novoEd.codigo},novoEd,{cor:cores[i],corT:txts[i]})]);
    setEds(l);saveE(l);
    setNovoEd({codigo:"",financiador:"FAPEAM",nome:"",desc:""});
  };

  const gerarCSV=()=>{
    const cols=["N","Titulo","Edital","Status","Entidade","Equipe","Valor","Submissao"];
    const rows=proj.map(p=>{
      const e=eds.find(x=>x.id===p.editalId);
      return [p.id,p.titulo,e?(e.codigo+"-"+e.nome):p.editalId,p.status,p.entidade,p.equipe,p.valor||0,p.dataSubmissao]
        .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",");
    });
    setExportTxt([cols.join(","),...rows].join("\n"));
    setCopied(false);
  };

  const gerarRelatorio=()=>{
    const linhas=proj.map(p=>{
      const e=eds.find(x=>x.id===p.editalId);
      let txt=String(p.id).padStart(2,"0")+". "+p.titulo+"\n";
      txt+="   Edital: "+(e?(e.nome+" "+e.codigo):"—")+" | Entidade: "+p.entidade+" | Status: "+p.status;
      if(p.valor)txt+=" | R$ "+Number(p.valor).toLocaleString("pt-BR");
      if(p.equipe)txt+="\n   Equipe: "+p.equipe;
      return txt+"\n";
    }).join("\n");
    const resumo=eds.map(e=>{
      const ps=proj.filter(p=>p.editalId===e.id);
      return "  "+e.financiador+" "+e.codigo+" — "+e.nome+": "+ps.length+" proposta(s)\n";
    }).join("");
    const txt=
      "INPACTAS & SEMCTI — GESTAO DE PROPOSTAS\n"+
      "Benjamin Constant · Alto Solimoes · Triplice Fronteira\n"+
      "Gerado em: "+new Date().toLocaleDateString("pt-BR")+"\n\n"+
      "KPIs\n"+
      "  Total: "+proj.length+" | Editais: "+eds.length+
      " | Em andamento: "+proj.filter(p=>["Submetido","Em Análise"].includes(p.status)).length+
      " | Aprovados: "+proj.filter(p=>p.status==="Aprovado").length+"\n\n"+
      "RESUMO POR EDITAL\n"+resumo+"\n"+
      "LISTA COMPLETA\n"+linhas;
    setExportTxt(txt);
    setCopied(false);
  };

  const copiar=()=>{
    try{
      navigator.clipboard.writeText(exportTxt).then(()=>setCopied(true));
    }catch(e){
      const t=document.createElement("textarea");
      t.value=exportTxt;document.body.appendChild(t);t.select();
      document.execCommand("copy");document.body.removeChild(t);
      setCopied(true);
    }
  };

  const totalV=proj.reduce((s,p)=>s+(Number(p.valor)||0),0);
  const W={width:"100%",boxSizing:"border-box"};
  const btnP={display:"inline-flex",alignItems:"center",background:GD,color:WHITE,fontSize:"0.83rem",fontWeight:600,padding:"0.55rem 1.1rem",borderRadius:4,border:"none",cursor:"pointer",fontFamily:"Inter,sans-serif"};
  const btnS={display:"inline-flex",alignItems:"center",background:"transparent",color:GD,fontSize:"0.83rem",fontWeight:600,padding:"0.55rem 1.1rem",borderRadius:4,border:"1.5px solid "+GD,cursor:"pointer",fontFamily:"Inter,sans-serif"};
  const abas=[["projetos","Projetos"],["dashboard","Dashboard"],["kanban","Kanban"],["tabela","Tabela"],["relatorios","Relatórios"]];

  return(
    <div style={{fontFamily:"Inter,sans-serif",background:WHITE,color:INK,position:"relative",minHeight:"100vh"}}>

      <Overlay open={!!detalhe} onClose={()=>setDetalhe(null)}>

              <thead>
                <tr style={{background:SAND,borderBottom:"2px solid "+CB}}>
                  {["N°","Título","Edital","Entidade","Status","Valor","Submissão"].map(h=>(
                    <th key={h} style={{padding:"0.6rem 0.75rem",textAlign:"left",fontWeight:600,color:INKL,fontSize:"0.7rem",letterSpacing:"0.05em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {proj.map(function(p,i){
                  return (
                    <tr key={p.id} onClick={()=>setDetalhe(p)}
                      style={{borderBottom:"1px solid "+CB,cursor:"pointer",background:i%2===0?WHITE:SAND}}>
                      <td style={{padding:"0.6rem 0.75rem",fontFamily:"Playfair Display,Georgia,serif",fontWeight:700,color:CB}}>{String(p.id).padStart(2,"0")}</td>
                      <td style={{padding:"0.6rem 0.75rem",color:INK,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.titulo}</td>
                      <td style={{padding:"0.6rem 0.75rem"}}><EditalBadge id={p.editalId} eds={eds}/></td>
                      <td style={{padding:"0.6rem 0.75rem",color:INKL,whiteSpace:"nowrap"}}>{p.entidade}</td>
                      <td style={{padding:"0.6rem 0.75rem"}}><StatusBadge s={p.status}/></td>
                      <td style={{padding:"0.6rem 0.75rem",color:INKL,whiteSpace:"nowrap"}}>{fmtBRL(p.valor)}</td>
                      <td style={{padding:"0.6rem 0.75rem",color:INKL,whiteSpace:"nowrap"}}>{fmtData(p.dataSubmissao)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {aba==="relatorios"&&(
          <React.Fragment>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14,marginBottom:20}}>
              <div style={{background:SAND,border:"1px solid "+CB,borderRadius:10,padding:"1.5rem",display:"flex",flexDirection:"column",gap:"0.75rem"}}>
                <div style={{width:40,height:40,background:GP,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.2rem"}}>📊</div>
                <div style={{fontSize:"0.68rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:GM}}>Exportar</div>
                <div style={{fontFamily:"Playfair Display,Georgia,serif",fontSize:"1rem",fontWeight:700,color:INK}}>Planilha CSV</div>
                <div style={{fontSize:"0.82rem",color:INKL,lineHeight:1.7,flex:1}}>Gera dados formatados para copiar no Excel ou Google Sheets.</div>
                <button onClick={gerarCSV} style={btnP}>Gerar CSV</button>
              </div>
              <div style={{background:SAND,border:"1px solid "+CB,borderRadius:10,padding:"1.5rem",display:"flex",flexDirection:"column",gap:"0.75rem"}}>
                <div style={{width:40,height:40,background:GP,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.2rem"}}>📄</div>
                <div style={{fontSize:"0.68rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:GM}}>Exportar</div>
                <div style={{fontFamily:"Playfair Display,Georgia,serif",fontSize:"1rem",fontWeight:700,color:INK}}>Relatório completo</div>
                <div style={{fontSize:"0.82rem",color:INKL,lineHeight:1.7,flex:1}}>Relatório com KPIs, resumo por edital e lista de propostas.</div>
                <button onClick={gerarRelatorio} style={btnP}>Gerar relatório</button>
              </div>
            </div>
            {exportTxt&&(
              <div style={{background:WHITE,border:"1px solid "+CB,borderRadius:10,padding:"1.25rem",marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontWeight:600,fontSize:13,color:INK}}>Conteúdo gerado — clique em "Copiar tudo"</div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={copiar} style={Object.assign({},btnP,{background:copied?"#065F46":GD,fontSize:"0.78rem",padding:"0.38rem 0.9rem"})}>{copied?"✓ Copiado!":"Copiar tudo"}</button>
                    <button onClick={()=>setExportTxt("")} style={Object.assign({},btnS,{fontSize:"0.78rem",padding:"0.38rem 0.75rem"})}>✕</button>
                  </div>
                </div>
                <textarea readOnly value={exportTxt} onFocus={e=>e.target.select()} style={{width:"100%",boxSizing:"border-box",height:240,fontFamily:"monospace",fontSize:11,resize:"vertical",background:SAND,border:"1px solid "+CB,borderRadius:6,padding:"0.75rem",color:INK,lineHeight:1.6}}/>
              </div>
            )}
            <div style={{background:SAND,border:"1px solid "+CB,borderRadius:10,padding:"1.25rem"}}>
              <div style={{fontSize:"0.72rem",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:GM,marginBottom:12}}>Resumo por edital</div>
              {eds.map(function(e){
                const ps=proj.filter(p=>p.editalId===e.id);
                const tot=ps.reduce((s,p)=>s+(Number(p.valor)||0),0);
                return(
                  <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,padding:"0.6rem 0",borderBottom:"1px solid "+CB}}>
                    <EditalBadge id={e.id} eds={eds}/>
                    <span style={{fontSize:12,color:INKL}}>{ps.length} proposta(s)</span>
                    {tot>0&&<span style={{fontSize:12,color:INKL,marginLeft:"auto",fontWeight:600}}>{fmtBRL(tot)}</span>}
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
      </div>

      <footer style={{background:INK,color:"rgba(255,255,255,.6)",padding:"2.5rem 1.5rem 1.5rem",marginTop:"1rem"}}>
        <div style={{maxWidth:1000,margin:"0 auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1fr",gap:"2rem",paddingBottom:"2rem",borderBottom:"1px solid rgba(255,255,255,.1)",marginBottom:"1.5rem"}}>
            <div>
              <div style={{fontFamily:"Playfair Display,Georgia,serif",fontSize:"1.1rem",fontWeight:700,color:WHITE,marginBottom:"0.5rem"}}>InPACTAS & SEMCTI</div>
              <p style={{fontSize:"0.76rem",lineHeight:1.7,color:"rgba(255,255,255,.5)"}}>Incubadora de Negócios de Impacto Socioambiental do Alto Solimões — UFAM/INC<br/>Secretaria Municipal de Ciência, Tecnologia e Inovação de Benjamin Constant — AM<br/><br/>Brasil · Tríplice Fronteira</p>
            </div>
            <div>
              <div style={{fontSize:"0.68rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"rgba(255,255,255,.4)",marginBottom:"0.75rem"}}>Navegar</div>
              {abas.map(function(item){
                const k=item[0],l=item[1];
                return <button key={k} onClick={()=>setAba(k)} style={{display:"block",background:"none",border:"none",color:"rgba(255,255,255,.6)",fontSize:"0.82rem",cursor:"pointer",padding:"0.2rem 0",textAlign:"left"}}>{l}</button>;
              })}
            </div>
            <div>
              <div style={{fontSize:"0.68rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"rgba(255,255,255,.4)",marginBottom:"0.75rem"}}>Parcerias</div>
              {["FAPEAM","UFAM — INC","Prefeitura de Benjamin Constant","SEMCTI"].map(function(p){
                return <div key={p} style={{fontSize:"0.8rem",color:"rgba(255,255,255,.5)",marginBottom:4}}>{p}</div>;
              })}
            </div>
          </div>
          <div style={{fontSize:"0.72rem",color:"rgba(255,255,255,.3)",textAlign:"center"}}>© 2026 · InPACTAS & SEMCTI Benjamin Constant. Todos os direitos reservados.</div>
        </div>
      </footer>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
